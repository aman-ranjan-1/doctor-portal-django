<header class="doctor-topbar">

    <div class="doctor-topbar-left">

        <button class="doctor-toggle">

            <i class="fas fa-bars"></i>

        </button>

        <div class="doctor-heading">

            <h2>
                Doctor Dashboard
            </h2>

            <p>

                Welcome back,

                {% if user.first_name %}
                    Dr. {{ user.first_name }}
                {% else %}
                    Doctor
                {% endif %}

            </p>

        </div>

    </div>

    <div class="doctor-topbar-right">

        <!-- Search -->

        <div class="doctor-search">

            <i class="fas fa-search"></i>

            <input
                type="text"
                placeholder="Search patients, appointments...">

        </div>

        <!-- Notifications -->

        <div class="doctor-icon">

            <i class="fas fa-bell"></i>

            <span class="doctor-badge">

                5

            </span>

        </div>

        <!-- Messages -->

        <div class="doctor-icon">

            <i class="fas fa-envelope"></i>

            <span class="doctor-badge">

                3

            </span>

        </div>

        <!-- Doctor Profile -->

        <div class="doctor-profile-box">

            <div class="doctor-avatar-small">

                <i class="fas fa-user-md"></i>

            </div>

            <div class="doctor-user">

                <h6>

                    {% if user.first_name %}
                        Dr. {{ user.first_name }}
                    {% else %}
                        Doctor
                    {% endif %}

                </h6>

                <small>

                    Senior Consultant

                </small>

            </div>

        </div>

    </div>

</header>
