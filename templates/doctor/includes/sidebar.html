<aside class="doctor-sidebar">

    <!-- Logo -->

    <div class="doctor-sidebar-header">

        <div class="doctor-logo">

            <i class="fas fa-user-md"></i>

        </div>

        <h3>CityCare</h3>

        <span>Doctor Panel</span>

    </div>

    <!-- Doctor Profile -->

    <div class="doctor-profile">

        <div class="doctor-avatar">

            <i class="fas fa-user-md"></i>

        </div>

        <div class="doctor-info">

            <h5>

                {% if user.first_name %}
                    Dr. {{ user.first_name }}
                {% else %}
                    Doctor
                {% endif %}

            </h5>

            <small>Medical Specialist</small>

        </div>

    </div>

    <!-- Navigation -->

    <ul class="doctor-menu">

        <li class="doctor-menu-item active">

            <a href="{% url 'doctor_dashboard' %}">

                <i class="fas fa-home"></i>

                <span>Dashboard</span>

            </a>

        </li>

        <li class="doctor-menu-item">

            <a href="{% url 'doctor_appointments' %}">

                <i class="fas fa-calendar-check"></i>

                <span>Appointments</span>

            </a>

        </li>

        <li class="doctor-menu-item">

            <a href="{% url 'doctor_patients' %}">

                <i class="fas fa-user-injured"></i>

                <span>Patients</span>

            </a>

        </li>

        <li class="doctor-menu-item">

            <a href="{% url 'doctor_medical_records' %}">

                <i class="fas fa-file-medical"></i>

                <span>Medical Records</span>

            </a>

        </li>

        <li class="doctor-menu-item">

            <a href="{% url 'doctor_prescriptions' %}">

                <i class="fas fa-prescription"></i>

                <span>Prescriptions</span>

            </a>

        </li>

        <li class="doctor-menu-item">

            <a href="{% url 'doctor_schedule' %}">

                <i class="fas fa-clock"></i>

                <span>Schedule</span>

            </a>

        </li>

        <li class="doctor-menu-item">

            <a href="{% url 'doctor_report' %}">

                <i class="fas fa-chart-line"></i>

                <span>Reports</span>

            </a>

        </li>

        <li class="doctor-menu-item" class="{% if request.resolver_match.url_name == 'doctor_profile' %}active{% endif %}">

            <a href="{% url 'doctor_profile' %}">

                <i class="fas fa-user-cog"></i>

                <span>Profile</span>

            </a>

        </li>

        <li class="doctor-menu-item">

            <a href="{% url 'logout' %}">

                <i class="fas fa-sign-out-alt"></i>

                <span>Logout</span>

            </a>

        </li>

    </ul>

</aside>
