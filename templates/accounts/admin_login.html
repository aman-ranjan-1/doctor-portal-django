{% extends "layouts/base.html" %}


{% block title %}
Admin Login
{% endblock %}


{% block content %}


{% load static %}

<link rel="stylesheet" href="{% static 'css/accounts/admin_login.css' %}">

<div class="admin-login-wrapper">

<div class="admin-login-card">

<img
src="{% static 'images/icons/citycarelogo.PNG' %}"
class="admin-login-logo">

<h2 class="admin-login-title">

CityCare Admin

</h2>

<p class="admin-login-subtitle">

Authorized Administrators Only

</p>

<form method="POST">

{% csrf_token %}

<div class="admin-login-group">

<label>

Email

</label>

<input
type="email"
name="email"
class="admin-login-input"
required>

</div>

<div class="admin-login-group">

<label>

Password

</label>

<input
type="password"
name="password"
class="admin-login-input"
required>

</div>

<button
type="submit"
class="admin-login-btn">

Login

</button>

</form>

<div class="admin-login-footer">

CityCare Hospital Management System

</div>

</div>

</div>


{% endblock %}
